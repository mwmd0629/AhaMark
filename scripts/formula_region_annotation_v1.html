<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AhaMark 公式区域离线标注 v1</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
        color: #172033;
        background: #f4f6fa;
      }
      header,
      .panel {
        background: #fff;
        border: 1px solid #d8deea;
        border-radius: 10px;
        padding: 12px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        border-radius: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
      }
      .panel label {
        display: block;
        margin: 8px 0 3px;
      }
      .pages {
        max-height: 70vh;
        overflow: auto;
      }
      .page {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px;
        margin: 5px 0;
        border: 1px solid #ccd4e2;
        background: #fff;
        border-radius: 6px;
      }
      .page.active {
        border-color: #315efb;
        background: #eef2ff;
      }
      .stage-wrap {
        overflow: auto;
        max-height: 75vh;
      }
      .stage {
        position: relative;
        transform-origin: top left;
        margin: auto;
      }
      .stage img {
        display: block;
        user-select: none;
      }
      .stage svg {
        position: absolute;
        inset: 0;
        touch-action: none;
      }
      .box {
        fill: #315efb22;
        stroke: #315efb;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
      }
      .box.selected {
        fill: #ef444433;
        stroke: #ef4444;
      }
      .draft {
        fill: #16a34a22;
        stroke: #16a34a;
        stroke-width: 3;
        stroke-dasharray: 8 5;
        vector-effect: non-scaling-stroke;
      }
      button,
      select,
      input {
        font: inherit;
        padding: 6px;
      }
      button.primary {
        background: #315efb;
        color: #fff;
        border: 0;
        border-radius: 6px;
      }
      .danger {
        color: #b91c1c;
      }
      .status {
        margin-left: auto;
        color: #526078;
      }
      .hint {
        color: #526078;
        line-height: 1.5;
      }
      .row {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }
      @media (max-width: 850px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .pages {
          max-height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <input id="files" type="file" accept="image/png,image/jpeg" multiple />
      <button id="newDoc">新文档 ID</button
      ><button id="deletePage" class="danger">删除当前页</button>
      <button id="export" class="primary">验证并导出 JSON</button>
      <span class="status" id="status">未载入页面</span>
    </header>
    <main class="layout">
      <aside class="panel">
        <div class="hint">
          图片仅保存在此浏览器的私有 IndexedDB；公开 JSON
          不包含图片、路径、文件名或正文。每次操作自动保存到独立键
          <code>ahamark-formula-region-annotation-v1</code>。
        </div>
        <label>当前文档 ID</label><code id="docId"></code>
        <label>数据划分</label
        ><select id="split">
          <option>train</option>
          <option>dev</option>
          <option>test</option>
        </select>
        <label>页面模态</label
        ><select id="modality">
          <option>text_pdf</option>
          <option>scan</option>
          <option>photo</option>
          <option>synthetic</option>
        </select>
        <label>页面决定</label
        ><select id="pageStatus">
          <option value="pending" disabled>未决定</option>
          <option value="annotated">正常标注</option>
          <option value="no_formula">本页无公式</option>
          <option value="unjudgeable">无法可靠标注</option>
        </select>
        <label>新框/选中框类型</label
        ><select id="kind">
          <option>inline</option>
          <option>display</option>
          <option>multiline</option>
          <option>matrix</option>
          <option>unknown</option>
        </select>
        <label>印刷样式</label
        ><select id="style">
          <option>printed</option>
          <option>handwritten</option>
          <option>mixed</option>
          <option>unknown</option>
        </select>
        <div class="row" style="margin-top: 10px">
          <button id="redraw">重画选中框</button
          ><button id="deleteBox" class="danger">删除选中框</button>
        </div>
        <label>显示缩放 <span id="zoomText">100%</span></label
        ><input id="zoom" type="range" min="20" max="200" value="100" />
        <label>页面列表</label>
        <div class="pages" id="pages"></div>
      </aside>
      <section class="panel stage-wrap">
        <div id="empty" class="hint">
          选择本地
          PNG/JPG。拖动画框；点击框可选择并修改类型、重画或删除。同页可有多个框。
        </div>
        <div class="stage" id="stage" hidden>
          <img id="image" alt="本地标注页" /><svg id="overlay"></svg>
        </div>
      </section>
    </main>
    <script>
      (() => {
        "use strict";
        const KEY = "ahamark-formula-region-annotation-v1",
          DB = "ahamark-formula-region-private-images-v1";
        const $ = (id) => document.getElementById(id),
          state = JSON.parse(localStorage.getItem(KEY) || "null") || {
            schema_version: "formula-region-detection-v1",
            dataset_id: crypto.randomUUID(),
            annotator_decision_version: "decision-v1",
            active: null,
            current_document_id: crypto.randomUUID(),
            cases: [],
          };
        let selected = null,
          start = null,
          draft = null,
          redraw = false,
          objectUrl = null;
        const db = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = () => req.result.createObjectStore("images");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        const imagePut = async (id, blob) => {
          const d = await db,
            t = d.transaction("images", "readwrite");
          t.objectStore("images").put(blob, id);
        };
        const imageGet = async (id) =>
          new Promise(async (resolve, reject) => {
            const d = await db,
              r = d.transaction("images").objectStore("images").get(id);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
          });
        const imageDelete = async (id) => {
          const d = await db;
          d.transaction("images", "readwrite").objectStore("images").delete(id);
        };
        const current = () =>
          state.cases.find((c) => c.case_id === state.active);
        function save(msg = "已自动保存") {
          localStorage.setItem(KEY, JSON.stringify(state));
          $("status").textContent = msg;
          renderList();
        }
        function blankCase(width, height) {
          return {
            case_id: crypto.randomUUID(),
            document_id: state.current_document_id,
            split: "train",
            modality: "text_pdf",
            page_width: width,
            page_height: height,
            contains_formula: false,
            regions: [],
            quality_flags: ["none"],
            negative_tags: [],
            annotation_status: "pending",
            annotator_decision_version: "decision-v1",
          };
        }
        function renderList() {
          $("docId").textContent = state.current_document_id;
          $("pages").replaceChildren(
            ...state.cases.map((c, i) => {
              const b = document.createElement("button");
              b.className =
                "page" + (c.case_id === state.active ? " active" : "");
              b.textContent = `页 ${i + 1} · ${c.modality} · ${c.regions.length} 框 · ${c.annotation_status}`;
              b.onclick = () => {
                state.active = c.case_id;
                selected = null;
                save("已切换页面");
                loadCurrent();
              };
              return b;
            }),
          );
        }
        async function loadCurrent() {
          const c = current();
          $("empty").hidden = !!c;
          $("stage").hidden = !c;
          if (!c) return;
          for (const id of ["split", "modality", "pageStatus"])
            $(id).value = c[id === "pageStatus" ? "annotation_status" : id];
          $("kind").value = selectedRegion()?.kind || "inline";
          $("style").value = selectedRegion()?.print_style || "printed";
          const blob = await imageGet(c.case_id);
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          objectUrl = URL.createObjectURL(blob);
          $("image").src = objectUrl;
          $("overlay").setAttribute(
            "viewBox",
            `0 0 ${c.page_width} ${c.page_height}`,
          );
          applyZoom();
          draw();
        }
        function applyZoom() {
          const c = current();
          if (!c) return;
          const scale = Number($("zoom").value) / 100;
          $("zoomText").textContent = `${Math.round(scale * 100)}%`;
          $("stage").style.width = `${c.page_width * scale}px`;
          $("stage").style.height = `${c.page_height * scale}px`;
          $("image").style.width = $("stage").style.width;
          $("image").style.height = $("stage").style.height;
        }
        const selectedRegion = () =>
          current()?.regions.find((r) => r.region_id === selected);
        function draw() {
          const svg = $("overlay"),
            c = current();
          svg.replaceChildren();
          if (!c) return;
          c.regions.forEach((r) => {
            const el = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "rect",
            );
            for (const key of ["x", "y", "width", "height"])
              el.setAttribute(
                key,
                r.bbox[key] *
                  (key === "x" || key === "width"
                    ? c.page_width
                    : c.page_height),
              );
            el.setAttribute(
              "class",
              "box" + (r.region_id === selected ? " selected" : ""),
            );
            el.onclick = (e) => {
              e.stopPropagation();
              selected = r.region_id;
              $("kind").value = r.kind;
              $("style").value = r.print_style;
              draw();
            };
            svg.append(el);
          });
          if (draft) {
            const el = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "rect",
            );
            for (const key in draft) el.setAttribute(key, draft[key]);
            el.setAttribute("class", "draft");
            svg.append(el);
          }
        }
        function point(event) {
          const c = current(),
            rect = $("overlay").getBoundingClientRect();
          return {
            x: ((event.clientX - rect.left) / rect.width) * c.page_width,
            y: ((event.clientY - rect.top) / rect.height) * c.page_height,
          };
        }
        $("overlay").onpointerdown = (e) => {
          const c = current();
          if (!c || !["pending", "annotated"].includes(c.annotation_status))
            return;
          start = point(e);
          draft = { x: start.x, y: start.y, width: 0, height: 0 };
          $("overlay").setPointerCapture(e.pointerId);
          draw();
        };
        $("overlay").onpointermove = (e) => {
          if (!start) return;
          const p = point(e);
          draft = {
            x: Math.min(start.x, p.x),
            y: Math.min(start.y, p.y),
            width: Math.abs(p.x - start.x),
            height: Math.abs(p.y - start.y),
          };
          draw();
        };
        $("overlay").onpointerup = (e) => {
          if (!start || !draft) return;
          const c = current();
          if (draft.width >= 4 && draft.height >= 4) {
            const r = {
              region_id: redraw && selected ? selected : crypto.randomUUID(),
              bbox: {
                x: +(draft.x / c.page_width).toFixed(6),
                y: +(draft.y / c.page_height).toFixed(6),
                width: +(draft.width / c.page_width).toFixed(6),
                height: +(draft.height / c.page_height).toFixed(6),
              },
              kind: $("kind").value,
              print_style: $("style").value,
              quality_flags: ["none"],
              annotation_status: "confirmed",
            };
            if (redraw && selected)
              c.regions[c.regions.findIndex((x) => x.region_id === selected)] =
                r;
            else {
              c.regions.push(r);
              selected = r.region_id;
            }
            c.contains_formula = true;
            c.annotation_status = "annotated";
            save(redraw ? "已重画并自动保存" : "已新增并自动保存");
          }
          start = draft = null;
          redraw = false;
          draw();
        };
        $("files").onchange = async (e) => {
          for (const file of e.target.files) {
            if (!/^image\/(png|jpeg)$/.test(file.type)) {
              alert("只接受 PNG/JPG");
              continue;
            }
            const size = await new Promise((resolve, reject) => {
              const img = new Image(),
                url = URL.createObjectURL(file);
              img.onload = () => {
                resolve([img.naturalWidth, img.naturalHeight]);
                URL.revokeObjectURL(url);
              };
              img.onerror = reject;
              img.src = url;
            });
            const c = blankCase(...size);
            state.cases.push(c);
            state.active = c.case_id;
            await imagePut(c.case_id, file);
          }
          save("图片只保存到本浏览器");
          loadCurrent();
          e.target.value = "";
        };
        $("newDoc").onclick = () => {
          state.current_document_id = crypto.randomUUID();
          save("已生成新文档 ID");
        };
        $("deletePage").onclick = async () => {
          const c = current();
          if (!c || !confirm("只删除本工具中的当前随机页面与本地图片？"))
            return;
          state.cases = state.cases.filter((x) => x !== c);
          await imageDelete(c.case_id);
          state.active = state.cases[0]?.case_id || null;
          selected = null;
          save("已删除当前本地页");
          loadCurrent();
        };
        for (const id of ["split", "modality"]) {
          $(id).onchange = () => {
            const c = current();
            if (c) {
              c[id] = $(id).value;
              save();
            }
          };
        }
        $("pageStatus").onchange = () => {
          const c = current();
          if (!c) return;
          const value = $("pageStatus").value;
          if (
            value !== "annotated" &&
            c.regions.length &&
            !confirm("该决定会清空本页公式框，继续？")
          ) {
            $("pageStatus").value = c.annotation_status;
            return;
          }
          c.annotation_status = value;
          if (value !== "annotated") c.regions = [];
          c.contains_formula = c.regions.length > 0;
          selected = null;
          save();
          draw();
        };
        for (const id of ["kind", "style"]) {
          $(id).onchange = () => {
            const r = selectedRegion();
            if (r) {
              r[id === "style" ? "print_style" : "kind"] = $(id).value;
              save();
              draw();
            }
          };
        }
        $("redraw").onclick = () => {
          if (!selectedRegion()) return alert("请先选择一个框");
          redraw = true;
          $("status").textContent = "请拖出替代框";
        };
        $("deleteBox").onclick = () => {
          const c = current();
          if (!c || !selected) return;
          c.regions = c.regions.filter((r) => r.region_id !== selected);
          selected = null;
          c.contains_formula = c.regions.length > 0;
          save("已删除并自动保存");
          draw();
        };
        $("zoom").oninput = applyZoom;
        function overlap(a, b) {
          const ix = Math.max(
              0,
              Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x),
            ),
            iy = Math.max(
              0,
              Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y),
            ),
            inter = ix * iy;
          return inter / (a.width * a.height + b.width * b.height - inter);
        }
        $("export").onclick = () => {
          try {
            if (!state.cases.length) throw Error("没有页面");
            const docs = new Map();
            for (const c of state.cases) {
              if (c.annotation_status === "pending")
                throw Error("仍有页面未作人工决定");
              if (
                docs.has(c.document_id) &&
                docs.get(c.document_id) !== c.split
              )
                throw Error("同一 document_id 不能跨 train/dev/test");
              docs.set(c.document_id, c.split);
              for (let i = 0; i < c.regions.length; i++)
                for (let j = i + 1; j < c.regions.length; j++)
                  if (overlap(c.regions[i].bbox, c.regions[j].bbox) >= 0.9)
                    throw Error("存在 IoU≥0.9 的重复框");
              if (
                c.annotation_status === "annotated" &&
                (!c.regions.length ||
                  c.contains_formula !== Boolean(c.regions.length))
              )
                throw Error("页面公式状态与框不一致");
            }
            const clean = {
              schema_version: state.schema_version,
              dataset_id: state.dataset_id,
              annotator_decision_version: state.annotator_decision_version,
              cases: state.cases,
            };
            const a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob([JSON.stringify(clean, null, 2) + "\n"], {
                type: "application/json",
              }),
            );
            a.download = "formula-region-detection-v1.json";
            a.click();
            URL.revokeObjectURL(a.href);
            $("status").textContent = "验证通过；已导出脱敏 JSON";
          } catch (error) {
            alert(`导出失败：${error.message}`);
          }
        };
        renderList();
        loadCurrent();
      })();
    </script>
  </body>
</html>
