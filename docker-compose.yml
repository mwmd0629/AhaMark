services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: "${POSTGRES_DB:-ahamark}", POSTGRES_USER: "${POSTGRES_USER:-ahamark}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-in-production}"}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-ahamark-local}", MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-change-me-in-production}"}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, minio: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 10}
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: celery -A workers.celery_app:celery_app worker --loglevel=INFO
    env_file: [.env]
    depends_on: {redis: {condition: service_healthy}, api: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "celery -A workers.celery_app:celery_app inspect ping -d celery@$${HOSTNAME}"], interval: 15s, timeout: 10s, retries: 5}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile, args: {NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"}}
    environment: {NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}", HOSTNAME: "0.0.0.0"}
    ports: ["3000:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"], interval: 10s, timeout: 3s, retries: 10}
  local-llm:
    restart: unless-stopped
    image: ${AHAMARK_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - --model
      - /models/qwen3-4b/Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${LOCAL_LLM_API_KEY:-disabled}
      - --ctx-size
      - ${LOCAL_LLM_CONTEXT_SIZE:-8192}
      - --parallel
      - "1"
      - --jinja
    expose: ["8080"]
    volumes: [local_llm_models:/models:ro]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
volumes: {postgres_data: {}, redis_data: {}, minio_data: {}, local_llm_models: {}}
