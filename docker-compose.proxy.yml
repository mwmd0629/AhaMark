services:
  proxy:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./deploy/nginx/ahamark.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
