name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

x-app-env: &app-env
  APP_ENV: production
  DEBUG: "false"
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CORS_ORIGINS: '["https://localhost:${PREPROD_HTTPS_PORT:?}"]'
  TRUSTED_HOSTS: '["localhost","127.0.0.1"]'
  CSRF_TRUSTED_ORIGINS: '["https://localhost:${PREPROD_HTTPS_PORT:?}"]'
  SESSION_HMAC_SECRET: ${SESSION_HMAC_SECRET:?}
  DEMO_ACTOR_ENABLED: "false"
  AUTH_COOKIE_SECURE: "true"
  AUTH_RATE_LIMIT_FAIL_CLOSED: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
  MINIO_BUCKET: ${MINIO_BUCKET:?}
  MINIO_SECURE: "false"
  RECOGNITION_PROVIDER: rapidocr
  GRADING_PROVIDER: unavailable
  AI_GRADING_PROVIDER: ${AI_GRADING_PROVIDER:-unavailable}
  AI_GRADING_BASE_URL: ${AI_GRADING_BASE_URL:-}
  AI_GRADING_API_KEY: ${AI_GRADING_API_KEY:-}
  AI_GRADING_MODEL: ${AI_GRADING_MODEL:-}
  AI_GRADING_PROMPT_VERSION: ${AI_GRADING_PROMPT_VERSION:-ai-grading-v1}
  ASSIGNMENT_GENERATION_PROVIDER: ${ASSIGNMENT_GENERATION_PROVIDER:-unavailable}
  ASSIGNMENT_GENERATION_ENABLED: ${ASSIGNMENT_GENERATION_ENABLED:-true}
  ASSIGNMENT_GENERATION_ALLOW_EXTERNAL_PROVIDER_REQUESTS: ${ASSIGNMENT_GENERATION_ALLOW_EXTERNAL_PROVIDER_REQUESTS:-false}
  ASSIGNMENT_GENERATION_ALLOW_TEACHER_START: ${ASSIGNMENT_GENERATION_ALLOW_TEACHER_START:-true}
  ASSIGNMENT_GENERATION_SUGGESTION_ONLY: ${ASSIGNMENT_GENERATION_SUGGESTION_ONLY:-true}
  ASSIGNMENT_GENERATION_REAL_PROVIDER_QUALITY_PASSED: ${ASSIGNMENT_GENERATION_REAL_PROVIDER_QUALITY_PASSED:-false}
  ASSIGNMENT_GENERATION_BASE_URL: ${ASSIGNMENT_GENERATION_BASE_URL:-}
  ASSIGNMENT_GENERATION_API_KEY: ${ASSIGNMENT_GENERATION_API_KEY:-}
  ASSIGNMENT_GENERATION_MODEL: ${ASSIGNMENT_GENERATION_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *app-env
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
  api-a:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *app-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck: &api-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  api-b:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *app-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck: *api-health
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *app-env
    command: celery -A workers.celery_app:celery_app worker --loglevel=INFO
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: {NEXT_PUBLIC_API_URL: ""}
    environment: {NEXT_PUBLIC_API_URL: "", HOSTNAME: "0.0.0.0"}
    depends_on:
      api-a: {condition: service_healthy}
      api-b: {condition: service_healthy}
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${PREPROD_HTTPS_PORT:?}:8443"
    volumes:
      - ./deploy/nginx/preproduction.conf:/etc/nginx/conf.d/default.conf:ro
      - ./${PREPROD_EVIDENCE_ROOT:-.preproduction-v8}/${PREPROD_RUN_ID:?}/certs:/etc/nginx/certs:ro
    depends_on:
      api-a: {condition: service_healthy}
      api-b: {condition: service_healthy}
      web: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: {name: "${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_postgres_data}"}
  redis_data: {name: "${REDIS_VOLUME:-${COMPOSE_PROJECT_NAME}_redis_data}"}
  minio_data: {name: "${MINIO_VOLUME:-${COMPOSE_PROJECT_NAME}_minio_data}"}

networks:
  default: {name: "${PREPROD_NETWORK:-${COMPOSE_PROJECT_NAME}_default}"}
