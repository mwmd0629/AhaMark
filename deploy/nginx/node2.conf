log_format node2 '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status request_id=$request_id';
limit_req_zone $binary_remote_addr zone=login_proxy:10m rate=60r/m;

upstream api_pool {
    zone api_pool 64k;
    server api-a:8000 max_fails=1 fail_timeout=3s;
    server api-b:8000 max_fails=1 fail_timeout=3s;
}

server {
    listen 8443 ssl;
    server_name localhost 127.0.0.1 192.168.2.5 222.195.89.236;
    server_tokens off;
    autoindex off;
    access_log /var/log/nginx/access.log node2;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 250m;
    client_body_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    location = /auth/login {
        limit_req zone=login_proxy burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/(api|auth|health|ready|files)(/|$) {
        proxy_pass http://api_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    # Presigned GET/HEAD URLs use the configured public endpoint. Preserve the
    # exact Host (including port), because it is part of the S3 v4 signature.
    location ^~ /ahamark-files/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://web:3000;
        expires 1y;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 8443 default_server ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    return 444;
}
