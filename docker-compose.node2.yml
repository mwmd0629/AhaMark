x-node2-app-env: &node2-app-env
  CORS_ORIGINS: '["https://${NODE2_PUBLIC_HOST:?set NODE2_PUBLIC_HOST}:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}","https://${NODE2_INTERNAL_HOST:?set NODE2_INTERNAL_HOST}:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}"]'
  TRUSTED_HOSTS: '["${NODE2_PUBLIC_HOST:?set NODE2_PUBLIC_HOST}","${NODE2_INTERNAL_HOST:?set NODE2_INTERNAL_HOST}","localhost","127.0.0.1"]'
  CSRF_TRUSTED_ORIGINS: '["https://${NODE2_PUBLIC_HOST:?set NODE2_PUBLIC_HOST}:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}","https://${NODE2_INTERNAL_HOST:?set NODE2_INTERNAL_HOST}:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}"]'
  MINIO_PUBLIC_ENDPOINT: ${NODE2_PUBLIC_HOST:?set NODE2_PUBLIC_HOST}:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}
  MINIO_PUBLIC_SECURE: "true"
  FORMULA_RECOGNITION_PROVIDER: ${FORMULA_RECOGNITION_PROVIDER:-unavailable}
  FORMULA_RECOGNITION_BASE_URL: ${FORMULA_RECOGNITION_BASE_URL:-}
  FORMULA_RECOGNITION_API_KEY: ${FORMULA_RECOGNITION_API_KEY:-}
  FORMULA_RECOGNITION_ALLOWED_HOSTS: ${FORMULA_RECOGNITION_ALLOWED_HOSTS:-[]}
  FORMULA_RECOGNITION_ALLOW_LOCAL_HTTP: ${FORMULA_RECOGNITION_ALLOW_LOCAL_HTTP:-false}
  ANSWER_RECOGNITION_PROVIDER: unavailable
  GRADING_PROVIDER: ${GRADING_PROVIDER:-unavailable}
  GRADING_ALLOW_EXTERNAL_PROVIDER_REQUESTS: "false"
  GRADING_ALLOW_LOCAL_PROVIDER_REQUESTS: ${GRADING_ALLOW_LOCAL_PROVIDER_REQUESTS:-false}
  GRADING_ALLOWED_LOCAL_HOSTS: ${GRADING_ALLOWED_LOCAL_HOSTS:-[]}
  GRADING_BASE_URL: ${GRADING_BASE_URL:-}
  GRADING_API_KEY: ${GRADING_API_KEY:-}
  GRADING_MODEL: ${GRADING_MODEL:-}
  AI_GRADING_PROVIDER: ${AI_GRADING_PROVIDER:-unavailable}
  AI_GRADING_ALLOW_EXTERNAL_PROVIDER_REQUESTS: "false"
  AI_GRADING_ALLOW_LOCAL_PROVIDER_REQUESTS: ${AI_GRADING_ALLOW_LOCAL_PROVIDER_REQUESTS:-false}
  AI_GRADING_ALLOWED_LOCAL_HOSTS: ${AI_GRADING_ALLOWED_LOCAL_HOSTS:-[]}
  AI_GRADING_BASE_URL: ${AI_GRADING_BASE_URL:-}
  AI_GRADING_API_KEY: ${AI_GRADING_API_KEY:-}
  AI_GRADING_MODEL: ${AI_GRADING_MODEL:-}
  ASSIGNMENT_GENERATION_PROVIDER: ${ASSIGNMENT_GENERATION_PROVIDER:-unavailable}
  ASSIGNMENT_GENERATION_ALLOW_EXTERNAL_PROVIDER_REQUESTS: "false"
  ASSIGNMENT_GENERATION_ALLOW_LOCAL_PROVIDER_REQUESTS: ${ASSIGNMENT_GENERATION_ALLOW_LOCAL_PROVIDER_REQUESTS:-false}
  ASSIGNMENT_GENERATION_ALLOWED_LOCAL_HOSTS: ${ASSIGNMENT_GENERATION_ALLOWED_LOCAL_HOSTS:-[]}
  ASSIGNMENT_GENERATION_BASE_URL: ${ASSIGNMENT_GENERATION_BASE_URL:-}
  ASSIGNMENT_GENERATION_API_KEY: ${ASSIGNMENT_GENERATION_API_KEY:-}
  ASSIGNMENT_GENERATION_MODEL: ${ASSIGNMENT_GENERATION_MODEL:-}
  ASSIGNMENT_GENERATION_LOCAL_TIMEOUT_SECONDS: ${ASSIGNMENT_GENERATION_LOCAL_TIMEOUT_SECONDS:-600}
  ASSIGNMENT_GENERATION_LOCAL_MAX_RETRIES: ${ASSIGNMENT_GENERATION_LOCAL_MAX_RETRIES:-0}
  ASSIGNMENT_GENERATION_LOCAL_EXTRACTION_MAX_OUTPUT_TOKENS: ${ASSIGNMENT_GENERATION_LOCAL_EXTRACTION_MAX_OUTPUT_TOKENS:-1200}
  ASSIGNMENT_GENERATION_LOCAL_ANSWER_RUBRIC_MAX_OUTPUT_TOKENS: ${ASSIGNMENT_GENERATION_LOCAL_ANSWER_RUBRIC_MAX_OUTPUT_TOKENS:-800}
  ASSIGNMENT_GENERATION_TASK_QUEUE: ${ASSIGNMENT_GENERATION_TASK_QUEUE:-assignment_generation}
  RECOGNITION_RAPIDOCR_RUNTIME_ENABLED: ${RECOGNITION_RAPIDOCR_RUNTIME_ENABLED:-false}
  RECOGNITION_RAPIDOCR_MODEL_DOWNLOAD_ALLOWED: "false"
  RECOGNITION_RAPIDOCR_ARTIFACT_ROOT: ${RECOGNITION_RAPIDOCR_ARTIFACT_ROOT:-}
  RECOGNITION_RAPIDOCR_MANIFEST_SHA256: ${RECOGNITION_RAPIDOCR_MANIFEST_SHA256:-}
  CODEX_LOCAL_ENABLED: "false"
  SYNTHETIC_DEMO_RESET_ENABLED: "false"

services:
  postgres:
    image: ${AHAMARK_POSTGRES_IMAGE:-postgres:16-alpine}
  redis:
    image: ${AHAMARK_REDIS_IMAGE:-redis:7-alpine}
  minio:
    image: ${AHAMARK_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
  migrate:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  api-a:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  api-b:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  worker:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
    command: celery -A workers.celery_app:celery_app worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
  generation-worker:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
    command: celery -A workers.celery_app:celery_app worker --loglevel=INFO --queues=${ASSIGNMENT_GENERATION_TASK_QUEUE:-assignment_generation} --concurrency=${ASSIGNMENT_GENERATION_WORKER_CONCURRENCY:-1}
  web:
    image: ${AHAMARK_WEB_IMAGE:?set AHAMARK_WEB_IMAGE}
    build: !reset null
  nginx:
    image: ${AHAMARK_NGINX_IMAGE:-nginx:1.27-alpine}
    ports: !override
      - "0.0.0.0:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}:8443"
    volumes:
      - ./deploy/nginx/node2.conf:/etc/nginx/conf.d/default.conf:ro
  formula-ocr:
    profiles: ["local-ai"]
    image: ${AHAMARK_FORMULA_IMAGE:-ahamark/formula:disabled}
    build: !reset null
    environment:
      AHAMARK_FORMULA_PROVIDER_TOKEN: ${FORMULA_RECOGNITION_API_KEY:-disabled}
      AHAMARK_FORMULA_MODEL_DIR: /models/PP-FormulaNet_plus-M
      AHAMARK_FORMULA_MANIFEST_SHA256: ${AHAMARK_FORMULA_MANIFEST_SHA256:-disabled}
    expose: ["8765"]
    volumes:
      - formula_models:/models:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  local-llm:
    profiles: ["local-ai"]
    image: ${AHAMARK_LLM_IMAGE:-ahamark/local-llm:disabled}
    command:
      - --model
      - /models/Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${LOCAL_LLM_API_KEY:-disabled}
      - --ctx-size
      - ${LOCAL_LLM_CONTEXT_SIZE:-8192}
      - --parallel
      - "1"
      - --threads
      - ${LOCAL_LLM_THREADS:-32}
      - --threads-batch
      - ${LOCAL_LLM_THREADS_BATCH:-32}
      - --jinja
    # node2 uses rootless Docker without the kernel CFS controller; enforce
    # the effective bound with llama.cpp thread limits instead of cpus.
    cpus: !reset null
    expose: ["8080"]
    volumes:
      - local_llm_models:/models:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

volumes:
  formula_models:
    name: ${FORMULA_MODEL_VOLUME:-${COMPOSE_PROJECT_NAME}-formula-models}
    external: true
  local_llm_models:
    name: ${LOCAL_LLM_MODEL_VOLUME:-${COMPOSE_PROJECT_NAME}-local-llm-models}
    external: true
