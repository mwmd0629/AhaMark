x-node2-app-env: &node2-app-env
  MINIO_PUBLIC_ENDPOINT: localhost:${PREPROD_HTTPS_PORT:?set PREPROD_HTTPS_PORT}
  MINIO_PUBLIC_SECURE: "true"
  FORMULA_RECOGNITION_PROVIDER: unavailable
  ANSWER_RECOGNITION_PROVIDER: unavailable
  CODEX_LOCAL_ENABLED: "false"
  SYNTHETIC_DEMO_RESET_ENABLED: "false"

services:
  postgres:
    image: ${AHAMARK_POSTGRES_IMAGE:-postgres:16-alpine}
  redis:
    image: ${AHAMARK_REDIS_IMAGE:-redis:7-alpine}
  minio:
    image: ${AHAMARK_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
  migrate:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  api-a:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  api-b:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  worker:
    image: ${AHAMARK_API_IMAGE:?set AHAMARK_API_IMAGE}
    build: !reset null
    environment: *node2-app-env
  web:
    image: ${AHAMARK_WEB_IMAGE:?set AHAMARK_WEB_IMAGE}
    build: !reset null
  nginx:
    image: ${AHAMARK_NGINX_IMAGE:-nginx:1.27-alpine}
    volumes:
      - ./deploy/nginx/node2.conf:/etc/nginx/conf.d/default.conf:ro
